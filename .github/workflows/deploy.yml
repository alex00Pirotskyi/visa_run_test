name: Deploy demo to Cloudflare
on:
  workflow_run:
    workflows: [Flutter web checks]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visa-run-test-deploy
  cancel-in-progress: true
jobs:
  deploy:
    # Only trust successful push-to-main builds from this repository.
    # Do not grant Cloudflare credentials to artifacts from pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare credentials before downloading artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Download already tested and built Flutter web bundle
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: visa-run-web
          path: build/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Set up Flutter only for manually triggered deployments
        if: github.event_name == 'workflow_dispatch'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Build Flutter web only for manual deployments
        if: github.event_name == 'workflow_dispatch'
        run: |
          flutter pub get
          flutter build web --release
      - name: Verify web bundle
        run: |
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -f wrangler.toml
      - name: Deploy isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
