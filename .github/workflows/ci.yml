name: Flutter web checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Report release-bundle size
        run: |
          du -sh build/web
          find build/web -type f -printf '%s %p\n' | sort -nr | sed -n '1,12p'
      - name: Publish verified web artifact for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: visa-run-web
          path: build/web/
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
